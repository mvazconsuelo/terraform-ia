name: pull-request

# One workflow per PR. External tools and code do the judging: terraform (fmt, validate, test), TFLint, Checkov, the
# repository contract (tools/reviewer) and a read-only plan of every Terraform configuration the PR affects and its target branch owns.
# A PR into the default branch (production) skips the checks that already passed in develop and runs only the plan, the cost and the review. The final job builds ONE comment from those
# results. Its optional AI section only explains the evidence (intent vs plan) and can never change the verdict.
on:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: terraform fmt
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - run: terraform fmt -check -recursive

  # Which Terraform root configurations this PR affects (edited, or using a changed shared module or file). Everything
  # below that touches a configuration runs only for these; the others are not initialised, planned or validated.
  discover:
    name: affected configurations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      count: ${{ steps.d.outputs.count }}
      roots: ${{ steps.d.outputs.roots }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - id: d
        env:
          BASE: origin/${{ github.base_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          matrix=$(PYTHONPATH=tools python -m reviewer.engine discover --base "$BASE" --branch "$BASE_REF" --format matrix)
          {
            echo "matrix=$matrix"
            echo "count=$(printf '%s' "$matrix" | jq '.include | length')"
            echo "roots=$(printf '%s' "$matrix" | jq -r '[.include[].root] | join(" ")')"
          } >> "$GITHUB_OUTPUT"
          PYTHONPATH=tools python -m reviewer.engine discover --base "$BASE" --branch "$BASE_REF" --format text >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: terraform validate
    if: github.base_ref != github.event.repository.default_branch
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: validate the modules and the configurations this PR affects
        env:
          ROOTS: ${{ needs.discover.outputs.roots }}
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          # one provider download shared by every folder (each would otherwise unpack its own ~800 MB copy)
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tf-plugins"; mkdir -p "$TF_PLUGIN_CACHE_DIR"
          MODULES=$(PYTHONPATH=tools python -m reviewer.engine discover --base "$BASE" --modules)
          for d in $MODULES $ROOTS; do
            echo "== validate $d"
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done
          echo "validated: ${MODULES:-no module} ${ROOTS:-no configuration}"

  test:
    name: terraform test
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: test the modules this PR touches, or that use a touched module (mocked provider, no credentials)
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tf-plugins"; mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tested=0
          while read -r d; do
            [ -n "$d" ] && [ -d "$d/tests" ] || continue
            echo "== test $d"
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform test)
            tested=$((tested + 1))
          done < <(PYTHONPATH=tools python -m reviewer.engine discover --base "$BASE" --modules)
          echo "modules tested: $tested"

  tflint:
    name: TFLint
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - uses: terraform-linters/setup-tflint@v4
      - name: lint the modules this PR affects (root configurations are not modules, so they are not linted)
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          rc=0
          while read -r d; do
            [ -n "$d" ] || continue
            echo "== tflint $d"
            tflint --chdir "$d" --config "$GITHUB_WORKSPACE/.tflint.hcl" || rc=1
          done < <(PYTHONPATH=tools python -m reviewer.engine discover --base "$BASE" --modules)
          exit $rc

  checkov:
    name: Checkov
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml checkov
      - name: scan the modules this PR affects
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          args=()
          while read -r d; do [ -n "$d" ] && args+=(-d "$d"); done < <(PYTHONPATH=tools python -m reviewer.engine discover --base "$BASE" --modules)
          if [ "${#args[@]}" -eq 0 ]; then echo "No module affected; nothing to scan."; exit 0; fi
          # --soft-fail is TEMPORARY: the findings are listed but do not block; decide skip checks or fixes, then remove it
          checkov "${args[@]}" --framework terraform --compact --soft-fail

  contract:
    name: repository contract
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - name: organisation rules (tools/reviewer/rules.yaml)
        run: PYTHONPATH=tools python -m reviewer.engine check --all

  # Read-only plan of each affected configuration (with the AWS keys of the PR's target branch: develop or main). Not for forks:
  # they get no secrets. Nothing runs when no configuration is affected.
  plan:
    name: plan ${{ matrix.root }}
    needs: discover
    if: github.event.pull_request.head.repo.fork == false && needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/terraform.yml
    with:
      root: ${{ matrix.root }}
      branch: ${{ github.base_ref }}
      mode: plan
    secrets: inherit

  review:
    name: PR comment
    needs: [discover, fmt, validate, test, tflint, checkov, contract, plan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: plan-*
          merge-multiple: true
          path: plans
      - name: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}      # Settings > Secrets and variables > Actions > Secrets
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}              # optional; empty falls back to the default
          BASE: origin/${{ github.base_ref }}
          # Author-written text goes through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          R_FMT: ${{ needs.fmt.result }}
          R_VALIDATE: ${{ needs.validate.result }}
          R_TEST: ${{ needs.test.result }}
          R_TFLINT: ${{ needs.tflint.result }}
          R_CHECKOV: ${{ needs.checkov.result }}
          R_CONTRACT: ${{ needs.contract.result }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          MATRIX: ${{ needs.discover.outputs.matrix }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ARGS=(--base "$BASE" --branch "$BASE_REF" --out review.json --markdown review.md --pr-title "$PR_TITLE" --pr-body "$PR_BODY")
          ARGS+=(--check "terraform fmt=$R_FMT" --check "terraform validate=$R_VALIDATE" --check "terraform test=$R_TEST")
          ARGS+=(--check "TFLint=$R_TFLINT" --check "Checkov=$R_CHECKOV" --check "repository contract=$R_CONTRACT")
          # one plan and one cost estimate per affected configuration, keyed by the root path
          while IFS='|' read -r root slug; do
            [ -f "plans/plan-$slug.json" ] && ARGS+=(--plan "$root=plans/plan-$slug.json")
            [ -f "plans/cost-$slug.json" ] && ARGS+=(--infracost "$root=plans/cost-$slug.json")
          done < <(printf '%s' "$MATRIX" | jq -r '.include[] | "\(.root)|\(.slug)"')
          # The AI step is optional: off unless common.yaml sets ai.enabled and a key exists; never for forks (no secrets).
          [ "$IS_FORK" = "true" ] && ARGS+=(--no-ai)
          # a PR into the production branch makes every configuration protected (destroying stateful resources is CRITICAL)
          [ "$BASE_REF" = "$DEFAULT_BRANCH" ] && ARGS+=(--production)
          PYTHONPATH=tools python -m reviewer.engine review "${ARGS[@]}" || true   # the jobs above are the gate
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - name: sticky PR comment (fork PRs only get the job summary)
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes('<!-- terra-review -->'));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
