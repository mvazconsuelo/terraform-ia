name: pull-request

# One workflow per PR. External tools and code do the judging: terraform (fmt, validate, test), TFLint, Checkov, the
# repository contract (tools) and a read-only plan of every Terraform configuration the PR affects and its target branch owns.
# A PR into the default branch (production) skips the checks that already passed in develop and runs only the plan, the cost and the review. The final job builds ONE comment from those
# results. Its optional AI section only explains the evidence (intent vs plan) and can never change the verdict.
on:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: terraform fmt
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.16.0"
      - run: terraform fmt -check -recursive

  python:
    name: python (ruff, mypy)
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml types-PyYAML ruff==0.16.10 mypy==1.19.1
      - run: ruff check tools
      - run: mypy tools

  # Which Terraform root configurations this PR affects (edited, or using a changed shared module or file). Everything
  # below that touches a configuration runs only for these; the others are not initialised, planned or validated.
  discover:
    name: affected configurations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      count: ${{ steps.d.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - id: d
        env:
          BASE: origin/${{ github.base_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.ci.discover_roots --base "$BASE" --branch "$BASE_REF"

  validate:
    name: terraform validate
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.16.0"
      - name: validate the modules and the configurations this PR affects
        env:
          BASE: origin/${{ github.base_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.ci.terraform_validate

  tflint:
    name: TFLint
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - uses: terraform-linters/setup-tflint@v6
      - name: lint the modules this PR affects (root configurations are not modules, so they are not linted)
        env:
          BASE: origin/${{ github.base_ref }}
        run: python -m tools.ci.terraform_tflint

  checkov:
    name: Checkov
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.scan.outputs.failed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml checkov
      - name: scan the modules this PR affects
        id: scan
        env:
          BASE: origin/${{ github.base_ref }}
        run: python -m tools.ci.terraform_checkov

  contract:
    name: repository contract
    if: github.base_ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - name: organisation rules (tools/rules/rules.yaml)
        run: python -m tools.ci.contract_check --all

  # Read-only plan of each affected configuration (with the AWS keys of the PR's target branch: develop or main). Not for forks:
  # they get no secrets. Nothing runs when no configuration is affected.
  plan:
    name: plan ${{ matrix.root }}
    needs: discover
    if: github.event.pull_request.head.repo.fork == false && needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/terraform.yml
    with:
      root: ${{ matrix.root }}
      branch: ${{ github.base_ref }}
      mode: plan
    secrets: inherit

  review:
    name: PR comment
    needs: [discover, fmt, python, validate, tflint, checkov, contract, plan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read      # to link the jobs of this run
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: plan-*
          merge-multiple: true
          path: plans
      - name: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}      # Settings > Secrets and variables > Actions > Secrets
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}              # optional; empty falls back to the default
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}   # optional; used only if the main model is overloaded or out of quota
          BASE: origin/${{ github.base_ref }}
          # Author-written text goes through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          R_FMT: ${{ needs.fmt.result }}
          R_PYTHON: ${{ needs.python.result }}
          R_VALIDATE: ${{ needs.validate.result }}
          R_TFLINT: ${{ needs.tflint.result }}
          R_CHECKOV: ${{ needs.checkov.result }}
          R_CHECKOV_FAILED: ${{ needs.checkov.outputs.failed }}
          R_CONTRACT: ${{ needs.contract.result }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          MATRIX: ${{ needs.discover.outputs.matrix }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python -m tools.ci.pr_review

      - name: sticky PR comment (fork PRs only get the job summary)
        if: github.event.pull_request.head.repo.fork == false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -m tools.ci.pr_comment
