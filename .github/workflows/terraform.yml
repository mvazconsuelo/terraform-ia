name: terraform

# The only workflow that touches AWS: init -> plan -> (apply) of each Terraform root configuration a change affects.
#   called by pull-request.yml ... read-only plan of an affected root (its summary feeds the PR comment)
#   push to develop or main ...... apply the roots the push affected (edited, or using a changed shared module or file)
#   manual (Run workflow) ........ plan or apply one root
# The branch name is the name of the GitHub Environment, which holds that branch's AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# and AWS_REGION (as repository secrets they apply to both), so each branch can use its own AWS account. To use other branch
# names, change `branches` below. State: bucket <project>-tfstate-<account>-<region>, created once by hand; key <root>/terraform.tfstate.
on:
  workflow_call:
    inputs:
      root:
        required: true
        type: string
      environment:
        description: GitHub Environment (the name of the PR's target branch)
        required: true
        type: string
      mode:
        required: true
        type: string
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      root:
        description: Folder of the root configuration (e.g. infra/web)
        type: string
        required: true
      mode:
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

jobs:
  target:
    name: which roots
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.t.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - id: t
        env:
          EVENT: ${{ github.event_name }}
          ROOT: ${{ inputs.root }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          engine() { PYTHONPATH=tools python -m reviewer.engine "$@"; }
          if [ "$EVENT" = "push" ]; then
            base="$BEFORE"; case "$base" in 0000000*) base="HEAD~1" ;; esac
            matrix=$(engine discover --base "$base" --format matrix)
          else   # one root, named by the caller or by hand
            matrix=$(engine discover --all --format matrix | jq -c --arg r "$ROOT" '{include: [.include[] | select(.root == $r)]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ inputs.mode || 'apply' }} ${{ matrix.root }}
    needs: target
    if: needs.target.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # roots may depend on each other (networking before workloads): apply them in order
      matrix: ${{ fromJSON(needs.target.outputs.matrix) }}
    environment: ${{ inputs.environment || github.ref_name }}
    concurrency:
      group: terraform-${{ inputs.environment || github.ref_name }}-${{ matrix.slug }}
      cancel-in-progress: false
    env:
      ROOT: ${{ matrix.root }}
      SLUG: ${{ matrix.slug }}
      MODE: ${{ inputs.mode || 'apply' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      HAS_INFRACOST: ${{ secrets.INFRACOST_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - run: |
          set -euo pipefail
          : "${AWS_REGION:?Set the AWS_REGION secret}"

          # The backend block is generated only when the root has none.
          grep -qE '^\s*backend\s+"s3"' "$ROOT"/*.tf || printf 'terraform {\n  backend "s3" {}\n}\n' > "$ROOT/backend.tf"
          BUCKET="$(yq .project common.yaml)-tfstate-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION}"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || { echo "::error::State bucket $BUCKET does not exist. Create it once (environments/README.md)."; exit 1; }

          terraform -chdir="$ROOT" init -input=false \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=${ROOT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=$(yq .backend.encrypt common.yaml)" \
            -backend-config="use_lockfile=$(yq .backend.use_lockfile common.yaml)"
          terraform -chdir="$ROOT" plan -input=false -lock-timeout=10m -out=tfplan
          { echo "### ${ROOT} (${MODE})"; echo '```'; terraform -chdir="$ROOT" show -no-color tfplan; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "apply" ]; then terraform -chdir="$ROOT" apply -input=false -lock-timeout=10m tfplan; fi

      # ---- plan only: a sanitized summary (never the raw plan) and the cost estimate, for the PR comment.
      - uses: actions/setup-python@v5
        if: env.MODE == 'plan'
        with:
          python-version: "3.12"
      - uses: infracost/actions/setup@v3
        if: env.MODE == 'plan' && env.HAS_INFRACOST == 'true'
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: summarize the plan and estimate its cost
        if: env.MODE == 'plan'
        env:
        run: |
          set -euo pipefail
          terraform -chdir="$ROOT" show -json tfplan > "$RUNNER_TEMP/raw.json"
          python3 -m pip install -q pyyaml
          PYTHONPATH=tools python -m reviewer.engine plan-summary --plan "$RUNNER_TEMP/raw.json" --out "plan-${SLUG}.json"
          [ "$HAS_INFRACOST" = "true" ] && { infracost diff --path "$RUNNER_TEMP/raw.json" --format json --out-file "cost-${SLUG}.json" || echo "::warning::Infracost failed"; }
          rm -f "$RUNNER_TEMP/raw.json"
      - uses: actions/upload-artifact@v4
        if: env.MODE == 'plan' && always()
        with:
          name: plan-${{ matrix.slug }}
          path: |
            plan-${{ matrix.slug }}.json
            cost-${{ matrix.slug }}.json
          if-no-files-found: ignore
          retention-days: 3
