name: terraform

# The workflow has no logic of its own: each step calls one file of tools/ci, which decides what to do.
# The only workflow that touches AWS: init -> plan -> (apply) of one Terraform root configuration.
#   called by pull-request.yml ... read-only plan of an affected root (its summary feeds the PR comment)
#   manual (Run workflow) ........ plan or apply one root. This is the ONLY way to deploy: merging a pull request never touches AWS.
# The branch decides the AWS account: develop uses the AWS_*_DEVELOP secrets, main uses the AWS_*_MAIN secrets (any other
# branch, e.g. a manual run, uses develop's). Before anything runs, the account of the keys is compared with
# the account of the repository variable AWS_ACCOUNT_ID_DEVELOP or AWS_ACCOUNT_ID_MAIN, so keys pasted into the wrong secret stop the run. State: bucket
# <project>-tfstate-<account>-<region>, created once by hand; key <root>/terraform.tfstate.
on:
  workflow_call:
    inputs:
      root:
        required: true
        type: string
      branch:
        description: Target branch of the PR (decides the AWS account)
        required: true
        type: string
      mode:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      root:
        description: Folder of the root configuration (e.g. infra/web)
        type: string
        required: true
      mode:
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

jobs:
  target:
    name: which roots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.t.outputs.matrix }}
      count: ${{ steps.t.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - id: t
        env:
          EVENT: ${{ github.event_name }}
          ROOT: ${{ inputs.root }}
          REF_NAME: ${{ github.ref_name }}
        run: python -m tools.ci.select_roots

  run:
    name: ${{ matrix.root }}
    needs: target
    if: needs.target.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90      # an apply of a database or a load balancer can take a long time
    strategy:
      fail-fast: false
      max-parallel: 1 # roots may depend on each other (networking before workloads): apply them in order
      matrix: ${{ fromJSON(needs.target.outputs.matrix) }}
    concurrency:
      group: terraform-${{ matrix.slug }}
      cancel-in-progress: false
    # The workflow only hands over raw values. What they mean (plan or apply, which AWS account) is decided in tools/ci.
    env:
      ROOT: ${{ matrix.root }}
      SLUG: ${{ matrix.slug }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_BRANCH: ${{ inputs.branch }}
      REF_NAME: ${{ github.ref_name }}
      KEY_ID_DEVELOP: ${{ secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
      KEY_SECRET_DEVELOP: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
      KEY_ID_MAIN: ${{ secrets.AWS_ACCESS_KEY_ID_MAIN }}
      KEY_SECRET_MAIN: ${{ secrets.AWS_SECRET_ACCESS_KEY_MAIN }}
      AWS_ACCOUNT_ID_DEVELOP: ${{ vars.AWS_ACCOUNT_ID_DEVELOP }}
      AWS_ACCOUNT_ID_MAIN: ${{ vars.AWS_ACCOUNT_ID_MAIN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q pyyaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~> 1.16.0"
      - name: terraform init
        run: python -m tools.ci.terraform_init
      - name: terraform plan
        run: python -m tools.ci.terraform_plan
      - name: terraform apply
        run: python -m tools.ci.terraform_apply
      - name: terraform show -json
        run: python -m tools.ci.terraform_show_json
      - name: terraform versions
        run: python -m tools.ci.terraform_versions
      - name: infracost
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: python -m tools.ci.infracost_estimate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: plan-${{ matrix.slug }}
          path: |
            plan-${{ matrix.slug }}.json
            cost-${{ matrix.slug }}.json
            versions-${{ matrix.slug }}.json
          if-no-files-found: ignore
          retention-days: 3
