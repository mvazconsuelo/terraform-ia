# DEV environment: a single Terraform configuration (infra-example/dev/web-demo) reads this file.
# Block-style YAML only (no braces, no inline lists). Values are validated by the modules' typed inputs.
# Region is the AWS_REGION secret; the project name is also in the repo-root common.yaml.

# -------------------- tags --------------------
# What is specific to this root in the mandatory tags: its owner and cost center. The `project` and the `environment` come from
# common.yaml (the environment is the one this root is listed under in terraform.environments).
tags:
  owner: platform-team
  cost_center: cc-1234

# -------------------- network --------------------
network:
  name: "${project}-${environment}"
  cidr_block: 10.20.0.0/16
  nat_gateway_mode: none # none (no NAT: no cost, but the private subnets have no internet) | single | per_az
  availability_zones:
    - us-east-1a
    - us-east-1b
  public_subnet_cidrs:
    - 10.20.0.0/24
    - 10.20.1.0/24
  private_subnet_cidrs:
    - 10.20.10.0/24
    - 10.20.11.0/24

# -------------------- security_groups --------------------
# One security group per tier. `port` is a number.
# A rule has either `cidr_ipv4` (`vpc` = the VPC CIDR) or `source_sg` (alb for app, app for db).
security_groups:
  # ---------- alb ----------
  alb:
    name: "${project}-${environment}-alb"
    description: Application load balancer
    allow_public_ingress: true
    ingress:
      http:
        description: HTTP from the internet
        port: 80
        cidr_ipv4: 0.0.0.0/0
    egress:
      to_app:
        description: Forward to the app tier
        port: 8080
        cidr_ipv4: vpc
  # ---------- app ----------
  app:
    name: "${project}-${environment}-app"
    description: Application instances
    ingress:
      from_alb:
        description: Traffic from the ALB
        port: 8080
        source_sg: alb
    egress:
      https_out:
        description: HTTPS to AWS APIs and package mirrors via NAT
        port: 443
        cidr_ipv4: 0.0.0.0/0
      to_db:
        description: Database traffic
        port: 5432
        cidr_ipv4: vpc
  # ---------- db ----------
  db:
    name: "${project}-${environment}-db"
    description: Aurora database
    ingress:
      from_app:
        description: Database traffic from the app tier
        port: 5432
        source_sg: app

# -------------------- database --------------------
database:
  name: "${project}-${environment}-db"
  engine: postgresql # postgresql | mysql
  engine_version: "16.4" # choose a version Aurora currently supports
  port: 5432
  database_name: app
  instance_class: db.t4g.medium
  backup_retention_days: 3
  deletion_protection: false
  skip_final_snapshot: true
  instances:
    "1":
      promotion_tier: 0
  serverless_v2: # null = provisioned instances; set min_capacity and max_capacity for Aurora Serverless v2
  cluster_parameters:
    rds.force_ssl:
      value: "1"

# -------------------- certificate --------------------
certificate:
  name: "${project}-${environment}-web"
  domain_name: example.com # example only: use a domain you own
  subject_alternative_names:
    - "*.example.com"
  zone_id: # Route 53 hosted zone ID of the domain; empty creates no validation records and does not wait

# -------------------- alb --------------------
alb:
  name: "${project}-${environment}"
  internal: false # false = internet-facing in public subnets, true = private subnets
  deletion_protection: false
  rules: # none; each one names a listener, a priority, a target_group and path_patterns or host_headers
  target_groups:
    web:
      port: 8080
      target_type: instance
      health_check:
        path: /health
  listeners:
    http:
      port: 80
      protocol: HTTP
      default_action:
        type: forward
        target_group: web

# -------------------- instance_role --------------------
instance_role:
  name: "${project}-${environment}-web"
  create_instance_profile: true
  assume_role_services:
    - ec2.amazonaws.com
  managed_policy_arns:
    - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

# -------------------- compute --------------------
compute:
  name: "${project}-${environment}-web"
  port: 8080 # the port the web instances serve (the target group and the security group use the same one)
  target_group: web # ALB target group (alb.target_groups) the Auto Scaling Group registers with
  instance_type: t3.micro # free-tier eligible instance type
  ami_id: null # null resolves the latest Amazon Linux 2023; pin an AMI in production
  root_volume_size_gb: 20
  min_size: 1
  desired_size: 1
  max_size: 2
  health_check_type: ELB # EC2 | ELB
  health_check_grace_period: 300
  enable_instance_refresh: true
  scaling_policies:
    cpu:
      predefined_metric: ASGAverageCPUUtilization
      target_value: 60
