# PROD environment: a single Terraform configuration (infra-example/prod/web-demo) reads this file.
# Block-style YAML only (no braces, no inline lists). Values are validated by the modules' typed inputs.
# Region is the AWS_REGION secret; the project name is also in the repo-root common.yaml.

# -------------------- tags --------------------
# What is specific to this root in the mandatory tags: its owner and cost center. The `project` and the `environment` come from
# common.yaml (the environment is the one this root is listed under in terraform.environments).
tags:
  owner: platform-team
  cost_center: cc-1234

# -------------------- network --------------------
network:
  name: "${project}-${environment}"
  cidr_block: 10.30.0.0/16
  nat_gateway_mode: per_az
  availability_zones:
    - us-east-1a
    - us-east-1b
  public_subnet_cidrs:
    - 10.30.0.0/24
    - 10.30.1.0/24
  private_subnet_cidrs:
    - 10.30.10.0/24
    - 10.30.11.0/24

# -------------------- security_groups --------------------
security_groups:
  # ---------- alb ----------
  alb:
    name: "${project}-${environment}-alb"
    description: Application load balancer
    allow_public_ingress: true
    ingress:
      http:
        description: HTTP (redirected to HTTPS)
        port: 80
        cidr_ipv4: 0.0.0.0/0
      https:
        description: HTTPS from the internet
        port: 443
        cidr_ipv4: 0.0.0.0/0
    egress:
      to_app:
        description: Forward to the app tier
        port: 8080
        cidr_ipv4: vpc
  # ---------- app ----------
  app:
    name: "${project}-${environment}-app"
    description: Application instances
    ingress:
      from_alb:
        description: Traffic from the ALB
        port: 8080
        source_sg: alb
    egress:
      https_out:
        description: HTTPS to AWS APIs and package mirrors via NAT
        port: 443
        cidr_ipv4: 0.0.0.0/0
      to_db:
        description: Database traffic
        port: 5432
        cidr_ipv4: vpc
  # ---------- db ----------
  db:
    name: "${project}-${environment}-db"
    description: Aurora database
    ingress:
      from_app:
        description: Database traffic from the app tier
        port: 5432
        source_sg: app

# -------------------- database --------------------
database:
  name: "${project}-${environment}-db"
  engine: postgresql
  engine_version: "16.4"
  port: 5432
  database_name: app
  instance_class: db.r6g.large
  backup_retention_days: 14
  deletion_protection: true
  skip_final_snapshot: false
  instances:
    "1":
      promotion_tier: 0
    "2":
      promotion_tier: 1
  serverless_v2: # null = provisioned instances; set min_capacity and max_capacity for Aurora Serverless v2
  cluster_parameters:
    rds.force_ssl:
      value: "1"

# -------------------- certificate --------------------
certificate:
  name: "${project}-${environment}-web"
  domain_name: example.com # example only: use a domain you own
  subject_alternative_names:
    - "*.example.com"
  zone_id: # Route 53 hosted zone ID of the domain; empty creates no validation records and does not wait

# -------------------- alb --------------------
alb:
  name: "${project}-${environment}"
  internal: false
  deletion_protection: true
  rules: # none; each one names a listener, a priority, a target_group and path_patterns or host_headers
  target_groups:
    web:
      port: 8080
      target_type: instance
      health_check:
        path: /health
  listeners:
    http:
      port: 80
      protocol: HTTP
      default_action:
        type: redirect
        redirect:
          port: "443"
          protocol: HTTPS
          status_code: HTTP_301
    https:
      port: 443
      protocol: HTTPS
      certificate: web # the certificate of the `certificate` block above
      default_action:
        type: forward
        target_group: web

# -------------------- instance_role --------------------
instance_role:
  name: "${project}-${environment}-web"
  create_instance_profile: true
  assume_role_services:
    - ec2.amazonaws.com
  managed_policy_arns:
    - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

# -------------------- compute --------------------
compute:
  name: "${project}-${environment}-web"
  port: 8080 # the port the web instances serve (the target group and the security group use the same one)
  target_group: web # ALB target group (alb.target_groups) the Auto Scaling Group registers with
  instance_type: m6i.large
  ami_id: null # pin an AMI id before going to production
  root_volume_size_gb: 30
  min_size: 2
  desired_size: 2
  max_size: 6
  health_check_type: ELB
  health_check_grace_period: 300
  enable_instance_refresh: true
  scaling_policies:
    cpu:
      predefined_metric: ASGAverageCPUUtilization
      target_value: 55
