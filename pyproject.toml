# Settings for the Python quality checks (ruff and mypy). Run from the repository root: `ruff check tools` and `mypy tools`.
[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes (undefined names, unused imports) · I: import order · B: likely bugs
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
