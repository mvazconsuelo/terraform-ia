# Settings of the whole project: the project name, the remote state, the AI switch and the environments (branch, AWS account and roots).
# The pipeline and the reviewer read this file, and so does each root, for its `project` and its `environment` (the rest of its values,
# owner and cost center included, are in its own inputs.yaml).

# -------------------- project --------------------
project: terraform-ia

# -------------------- backend --------------------
backend:
  encrypt: true
  use_lockfile: true # S3 native lock (Terraform >= 1.11); no DynamoDB table needed

# -------------------- ai --------------------
# Optional AI analysis (Gemini) in the PR comment. Off by default: nothing leaves the repository until you enable it.
# It also needs the GEMINI_API_KEY secret. The deterministic review (the authority) works the same either way.
ai:
  enabled: true

# -------------------- terraform --------------------
# Terraform root configurations (folders with their own state) are discovered automatically: a folder nobody calls as a
# module that has resources, modules, a provider or a backend. Only the ones a change affects are planned and applied.
# Optional settings under `terraform:`:
#   roots:    [infra/*]    pin the roots instead of inferring them
#   modules:  [modules]    folders with shared modules (default)
#
# `environments` is where each environment is defined, once:
#   branch:   the branch that deploys it (the branch only plans and applies the roots of its environments)
#   account:  the AWS account id of that branch's keys; the pipeline stops if the keys belong to another account
#   roots:    the root folders that belong to it; a root takes its `environment` tag from here
# Environments of the same branch share its keys, so they must name the same account.
terraform:
  environments:
    dev:
      branch: develop
      account: "785995043299"
      roots:
        - infra-example/dev/web-demo
    prod:
      branch: main
      account: "<prod-account-id>"
      roots:
        - infra-example/prod/web-demo
