# Values shared by every Terraform configuration. Single source for the project name, the region and the
# remote-state settings. main.tf and the workflows read this file; the pipeline exports the region as AWS_REGION.
project: shop
region: us-east-1

backend:
  encrypt: true
  use_lockfile: true # S3 native lock (Terraform >= 1.10); no DynamoDB table needed

# Optional AI analysis (Gemini) in the PR comment. Off by default: nothing leaves the repository until you enable it.
# It also needs the GEMINI_API_KEY secret. The deterministic review (the authority) works the same either way.
ai:
  enabled: false

# Which folders are Terraform root configurations (each has its own state and its own plan). The pull request is judged
# per affected configuration: the ones whose files changed, or that use a changed module or shared file. Nothing is run
# for the others. Folder names are yours: infra/web, terraform/networking, environments/dev, ...
terraform:
  roots: # globs; leave out to infer them (a folder nobody calls as a module that has resources, modules, a provider or a backend)
    - environments/*
  modules: # folders that hold shared modules
    - modules
  protected: # configurations where destroying or replacing stateful resources is CRITICAL
    - environments/prod
  deploy: # which affected configurations are applied, and when
    on_pr_approved:
      - environments/dev
    on_merge_to_main:
      - environments/prod
  conventions: # optional: only for the family of configurations that share one layout
    layout:
      roots:
        - environments/*
      files:
        - main.tf
        - inputs.yaml
      template_suffixes:
        - .tftpl
      identical:
        - main.tf
        - "*.tftpl"
