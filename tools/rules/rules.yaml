# THE CATALOG OF CHECKS: the only source of truth for what the repository enforces.
#
# The rules are grouped by the question they answer. The family is the first part of the id (FAMILY-NNN):
#
#   MODULE  Is the module built as the standard says?             modules/**
#   TAGS    Does everything that can be tagged carry the tags?     modules/**
#   ROOT    Is the root built as the project says?                 infra-example/** (a root and its inputs.yaml)
#   POLICY  Do the values of a root meet the project's policy?     a root's inputs.yaml
#   PLAN    What will terraform do, and what will it cost?         the terraform plan and the Infracost estimate
#
# One entry per rule:
#   id, reads, category, severity, title, explanation, recommendation   what the rule is, in the pull request comment
#   check                                                              the name of the function that implements it
#   <anything else>                                                    the parameters of that function
# `reads` says what the check looks at, and so which file holds its function:
#   code ... the .tf files          rules/code_rules.py
#   inputs .. a root's inputs.yaml  rules/inputs_rules.py
#   plan .... the plan and the cost rules/plan_rules.py
#
# Deliberately NOT here, because an external tool is the authority for it (do not duplicate it):
#   terraform fmt / validate ............... syntax, formatting, validation
#   TFLint (.tflint.hcl) ................... lint: required_version / required_providers, documented variables and outputs
#   Checkov ................................ generic security: open ingress, hard-coded secrets, public endpoints, encryption
#   Infracost .............................. prices (this repo only reads its numbers)
# The rules below are what those tools cannot know: module boundaries, naming, mandatory tags, root layout, the project's
# policy, and the correlation of the plan and the cost estimate with the repository's own standards.
rules:

# ================================================================================================================
# MODULE: is the module built as the standard says?
# ================================================================================================================
- id: MODULE-001
  reads: code
  category: MODULE_STANDARD
  severity: HIGH
  check: resource_declared_outside_its_module
  title: Reusable capability implemented outside its module
  explanation: >-
    This resource type is a reusable capability with a module in the modules folder. Root configurations
    (any folder that is not a module) must consume the module instead of declaring the resource directly.
  recommendation: Consume (or create) the module listed in `module` instead of declaring the resource.
  capabilities:
    aws_lambda_function: modules/lambda
    aws_s3_bucket: modules/s3
    aws_vpc: modules/vpc
    aws_subnet: modules/vpc
    aws_nat_gateway: modules/vpc
    aws_internet_gateway: modules/vpc
    aws_route_table: modules/vpc
    aws_route_table_association: modules/vpc
    aws_route: modules/vpc
    aws_eip: modules/vpc
    aws_vpc_endpoint: modules/vpc
    aws_security_group: modules/security-group
    aws_vpc_security_group_ingress_rule: modules/security-group
    aws_vpc_security_group_egress_rule: modules/security-group
    aws_iam_role: modules/iam
    aws_iam_role_policy: modules/iam
    aws_iam_role_policy_attachment: modules/iam
    aws_iam_instance_profile: modules/iam
    aws_eks_cluster: modules/eks/cluster
    aws_eks_access_entry: modules/eks/cluster
    aws_eks_access_policy_association: modules/eks/cluster
    aws_iam_openid_connect_provider: modules/eks/cluster
    aws_eks_node_group: modules/eks/node-group
    aws_eks_addon: modules/eks/addons
    aws_rds_cluster: modules/aurora
    aws_rds_cluster_instance: modules/aurora
    aws_rds_cluster_parameter_group: modules/aurora
    aws_db_parameter_group: modules/aurora
    aws_db_subnet_group: modules/aurora
    aws_db_instance: modules/aurora
    aws_lb: modules/elb/nlb or modules/elb/alb
    aws_lb_target_group: modules/elb/nlb or modules/elb/alb
    aws_lb_listener: modules/elb/nlb or modules/elb/alb
    aws_lb_listener_rule: modules/elb/alb
    aws_wafv2_web_acl_association: modules/elb/alb
    aws_acm_certificate: modules/acm
    aws_acm_certificate_validation: modules/acm
    aws_route53_zone: modules/route53/zone
    aws_route53_record: modules/route53/records
    aws_apigatewayv2_api: modules/api-gateway
    aws_apigatewayv2_stage: modules/api-gateway
    aws_apigatewayv2_route: modules/api-gateway
    aws_apigatewayv2_integration: modules/api-gateway
    aws_apigatewayv2_vpc_link: modules/api-gateway
    aws_api_gateway_rest_api: modules/api-gateway
    aws_cloudwatch_event_rule: modules/eventbridge
    aws_cloudwatch_event_bus: modules/eventbridge
    aws_cloudwatch_event_target: modules/eventbridge
    aws_launch_template: modules/ec2/launch-template
    aws_autoscaling_group: modules/ec2/asg
    aws_autoscaling_policy: modules/ec2/asg
    aws_instance: modules/ec2/instances
    aws_ebs_volume: modules/ec2/instances
- id: MODULE-002
  reads: code
  category: MODULE_STANDARD
  severity: MEDIUM
  check: module_missing_required_files
  title: Module is missing required contract files
  explanation: Every module must ship versions.tf, variables.tf, outputs.tf, and README.md.
  recommendation: Add the missing files; see docs/module-standard.md.
  required:
  - versions.tf
  - variables.tf
  - outputs.tf
  - README.md
- id: MODULE-003
  reads: code
  category: MODULE_STANDARD
  severity: MEDIUM
  check: resource_has_arbitrary_name
  title: Resource does not follow the `this` naming convention
  explanation: >-
    The primary resource of a type inside a module is named `this`; additional resources use role names (`public`,
    `private`, `nat`). Arbitrary, type-echoing or environment-specific names (`my_bucket`, `prod_bucket`, `bucket123`,
    `bucket`) leak detail and break refactors.
  recommendation: Rename to `this` or a role-based name (use a `moved` block to avoid replacement).
- id: MODULE-004
  reads: code
  category: MODULE_STANDARD
  severity: MEDIUM
  check: variable_typed_any
  title: Variable uses `type = any`
  explanation: Public module inputs must be strongly typed so misuse fails at plan time.
  recommendation: Replace `any` with an explicit object/map/list type and add validation.
- id: MODULE-005
  reads: code
  category: MODULE_STANDARD
  severity: MEDIUM
  check: component_outside_domain_folder
  title: Domain component placed outside its domain directory
  explanation: >-
    Multi-component domains live in modules/<domain>/<component> (modules/eks/*, modules/ec2/*, modules/elb/*, modules/route53/*).
    Top-level modules/eks-*, modules/ec2-*, modules/elb-*, modules/route53-*, modules/nlb or modules/alb are not allowed.
  recommendation: Move the module to modules/<domain>/<component>.
  forbidden_prefixes:
  - eks-
  - ec2-
  - elb-
  - nlb/
  - alb/
  - route53-
- id: MODULE-006
  reads: code
  category: NETWORKING
  severity: HIGH
  check: eks_autoscaling_group_declared_directly
  title: Auto Scaling Group managed directly for EKS
  explanation: >-
    EKS managed node groups own their Auto Scaling Groups. Declaring aws_autoscaling_group in the EKS module domain or in a root configuration bypasses
    modules/eks/node-group and fights the EKS control plane.
  recommendation: Express capacity through modules/eks/node-group `groups`.
  module_paths:
  - eks/

# ================================================================================================================
# TAGS: does everything that can be tagged carry the mandatory tags?
# ================================================================================================================
- id: TAGS-001
  reads: code
  category: GOVERNANCE
  severity: HIGH
  check: resource_missing_mandatory_tags
  title: Taggable resource does not receive mandatory tags
  explanation: >-
    Every taggable AWS resource managed by a module must receive the mandatory cost-allocation tags. Untagged
    resources cannot be attributed in cost reports.
  recommendation: Add `tags = merge(local.tags, { Name = ... })` using the module's mandatory tag local.
  mandatory_tags: &mandatory_tags
  - Environment
  - Owner
  - CostCenter
  - Project
  - ManagedBy
  taggable_types:
  - aws_vpc
  - aws_subnet
  - aws_internet_gateway
  - aws_route_table
  - aws_eip
  - aws_nat_gateway
  - aws_vpc_endpoint
  - aws_security_group
  - aws_s3_bucket
  - aws_eks_cluster
  - aws_eks_node_group
  - aws_eks_addon
  - aws_eks_access_entry
  - aws_iam_openid_connect_provider
  - aws_db_instance
  - aws_db_subnet_group
  - aws_lb
  - aws_lb_target_group
  - aws_lambda_function
  - aws_sqs_queue
  - aws_kms_key
  - aws_iam_role
  - aws_cloudwatch_log_group
  - aws_apigatewayv2_api
  - aws_apigatewayv2_vpc_link
  - aws_apigatewayv2_stage
  - aws_iam_instance_profile
  - aws_launch_template
  - aws_instance
  - aws_ebs_volume
  - aws_cloudwatch_event_bus
  - aws_cloudwatch_event_rule
  - aws_rds_cluster
  - aws_rds_cluster_instance
  - aws_rds_cluster_parameter_group
  - aws_db_parameter_group
  - aws_lb_listener
  - aws_lb_listener_rule
  - aws_acm_certificate
  - aws_route53_zone
- id: TAGS-002
  reads: code
  category: GOVERNANCE
  severity: MEDIUM
  check: module_missing_tag_variables
  title: Module does not expose the mandatory-tag input contract
  explanation: >-
    Modules creating taggable resources must accept `tags` (an object with environment, owner, cost_center and project)
    and `extra_tags` (a free-form map).
  recommendation: Add the `tags` and `extra_tags` variables as defined in the module standard.
- id: TAGS-003
  reads: code
  category: GOVERNANCE
  severity: HIGH
  check: autoscaling_group_does_not_propagate_tags
  title: Auto Scaling Group does not propagate mandatory tags
  explanation: >-
    Auto Scaling Groups have no `tags` map; tags are `tag` blocks with propagate_at_launch. Without them, instances
    and volumes launched by the group are untagged and invisible in cost reports.
  recommendation: Add a `dynamic "tag"` block over the module's merged tags with propagate_at_launch = true.
  mandatory_tags: *mandatory_tags

# ================================================================================================================
# ROOT: is the root built as the project says?
# ROOT-001 and ROOT-002 apply to the roots matched by their `roots` patterns; with no pattern they do nothing.
# An environment is where common.yaml lists the root (terraform.environments).
# ================================================================================================================
- id: ROOT-001
  reads: code
  category: MODULE_STANDARD
  severity: HIGH
  check: root_breaks_layout
  title: Root configuration does not follow its layout
  explanation: >-
    Each root of the family holds only the listed files plus its templates, and its main.tf declares no provider,
    required_providers or backend: the region comes from AWS_REGION, versions from the modules and the backend is
    generated by the pipeline.
  recommendation: >-
    Keep only the listed files and templates in the configuration and remove provider, version and backend settings.
  roots:
  - infra-example/*/web-demo
  files:
  - main.tf
  - data.tf
  - network.tf
  - database.tf
  - load_balancer.tf
  - ec2.tf
  - outputs.tf
  - inputs.yaml
  template_suffixes:
  - .tftpl
- id: ROOT-002
  reads: code
  category: MODULE_STANDARD
  severity: HIGH
  check: root_files_differ
  title: A root configuration's files differ from its siblings
  explanation: >-
    The infrastructure is the same in every root of the family and only the data differs. A .tf file or template that
    diverges hides untested behaviour in the more critical one.
  recommendation: >-
    Make the listed files identical across the family and move the difference into inputs.yaml.
  roots:
  - infra-example/*/web-demo
  identical:
  - "*.tf"
  - "*.tftpl"
- id: ROOT-003
  reads: inputs
  category: GOVERNANCE
  severity: HIGH
  check: root_not_in_an_environment
  title: Root is not assigned to an environment
  explanation: >-
    A root takes its `environment` and its `project` tags from common.yaml, so it must be listed under an environment of
    terraform.environments. Without it the root has no environment, and no branch deploys it.
  recommendation: List the root under its environment in terraform.environments of common.yaml.
  file: inputs.yaml
- id: ROOT-004
  reads: inputs
  category: GOVERNANCE
  severity: HIGH
  check: root_tags_invalid
  title: Root tags are invalid
  explanation: >-
    The `tags` block of a root's inputs.yaml carries what is specific to the project: the owner and the cost center. It must
    not set the tags that common.yaml decides for every root.
  recommendation: Keep only the owner and the cost center in the tags of inputs.yaml.
  file: inputs.yaml
  required_tags:
  - owner
  - cost_center
  common_tags:
  - environment
  - project
- id: ROOT-005
  reads: code
  category: MODULE_STANDARD
  severity: MEDIUM
  check: root_call_holds_logic
  title: Module call reshapes values with logic
  explanation: >-
    A module call in a root passes values as they are: `local.inputs.*`, the outputs of other modules and `templatestring`. A `for`
    expression, a conditional or a function that reshapes the values belongs to the module, which resolves and defaults its own inputs.
  recommendation: >-
    Move the logic into the module. When a value comes from another module, the receiving module takes a map (for example
    `certificates = { web = module.certificate.certificate_arn }`) and the inputs.yaml names the key.
  forbidden_functions:
  - try
  - can
  - merge
  - lookup
  - flatten
  - concat
  - coalesce
  - contains
  - length
  - anytrue
  - alltrue
  - compact
  - distinct
  - zipmap
  - keys
  - values
  - element
  - one
  - join
  - split

# ================================================================================================================
# POLICY: do the values of a root meet the project's policy? (a root's inputs.yaml)
# ================================================================================================================
- id: POLICY-001
  reads: inputs
  category: RELIABILITY
  severity: HIGH
  check: production_requirements_not_met
  title: Production root does not meet a production requirement
  explanation: >-
    A root of an environment deployed from the main branch (terraform.environments in common.yaml) must meet every
    requirement listed here. Each requirement is a dotted `path` into the root's inputs.yaml and one test: `equals`, `any_equals` (a `*`
    step goes through every value of a block), `at_least` or `count_at_least`.
  recommendation: Set the value in the root's inputs.yaml, or change the requirement here if the policy changed.
  file: inputs.yaml
  requirements:
  - path: alb.listeners.*.protocol
    any_equals: HTTPS
    why: production traffic is served over HTTPS
  - path: database.deletion_protection
    equals: true
    why: the production database cannot be deleted by mistake
  - path: database.skip_final_snapshot
    equals: false
    why: a final snapshot is kept when the database is destroyed
  - path: network.nat_gateway_mode
    equals: per_az
    why: one NAT gateway per zone, so a zone outage keeps the egress
  - path: database.instances
    count_at_least: 2
    why: failover needs a reader
  - path: compute.min_size
    at_least: 2
    why: the web tier must survive losing an instance

# ================================================================================================================
# PLAN: what will terraform do, and what will it cost?
# ================================================================================================================
- id: PLAN-001
  reads: plan
  category: LIFECYCLE
  severity: CRITICAL
  check: plan_destroys_stateful_resource
  title: Plan destroys or replaces a stateful resource
  explanation: >-
    Destroying or replacing a stateful resource (database, bucket, key, cluster) loses data or causes downtime.
    It is CRITICAL for any plain destroy, and for a replacement in a root of a protected environment or in any pull request
    into the production branch; a replacement elsewhere is HIGH.
  recommendation: >-
    Find the attribute that forces replacement (see the plan), revert it or plan a migration (snapshot, blue/green),
    and confirm deletion protection and backups before applying.
  protected_environments:
  - prod
  stateful_types:
  - aws_rds_cluster
  - aws_rds_cluster_instance
  - aws_db_instance
  - aws_db_subnet_group
  - aws_s3_bucket
  - aws_kms_key
  - aws_eks_cluster
  - aws_secretsmanager_secret
- id: PLAN-002
  reads: plan
  category: COST
  severity: MEDIUM
  check: plan_cost_increase_above_threshold
  title: Infracost reports a large monthly increase
  explanation: >-
    The estimated monthly cost grows by more than the threshold. The figure comes from Infracost, never from the
    model.
  recommendation: Check which resources drive the increase (see the cost drivers) and confirm the sizing is intended.
  monthly_delta_usd: 200
